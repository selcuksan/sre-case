apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-case-app
  labels:
    app: sre-case-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sre-case-app
  template:
    metadata:
      labels:
        app: sre-case-app
    spec:
      containers:
        - name: app
          image: selcuksan/sre-case-app:0.5.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: OTEL_SERVICE_NAME
              value: sre-case-app
            # Uygulama tek adres biliyor; dagitimi Collector yapiyor.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector-opentelemetry-collector.monitoring.svc:4317
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_METRICS_EXPORTER
              value: otlp
            - name: OTEL_LOGS_EXPORTER
              value: none
            # Varsayilan 60 saniye. Olcekleme davranisini saniye seviyesinde analiz
            # edebilmek icin 10 saniyeye cekildi.
            - name: OTEL_METRIC_EXPORT_INTERVAL
              value: "10000"
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
