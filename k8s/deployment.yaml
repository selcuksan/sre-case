apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-case-app
  labels:
    app: sre-case-app
spec:
  # Baslangic degeri. Bundan sonrasini HPA yonetiyor.
  replicas: 1
  selector:
    matchLabels:
      app: sre-case-app
  template:
    metadata:
      labels:
        app: sre-case-app
    spec:
      containers:
        - name: app
          image: selcuksan/sre-case-app:0.4.0
          # Image kind load ile node'lara yuklendi, Docker Hub'a gitmesine gerek yok.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          # requests = limits: pod Guaranteed QoS olur, HPA'nin gordugu kullanim orani %100'u asamaz.
          # CPU limiti ayrica JVM'in cgroup limitini okumasini saglar (availableProcessors=1).
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Varsayilan timeout 1 saniye. Yuk altinda /health de gecikince pod unready oluyor,
          # unready podun metrigi HPA'ya gitmiyor ve olcekleme duruyor. Olculdu: varsayilan
          # ayarlarla ayni testte %11 hata ve restart, asagidaki ayarlarla %0 hata.
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
