apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-case-app
  labels:
    app: sre-case-app
spec:
  # Baslangic degeri. Bundan sonrasini HPA yonetiyor.
  replicas: 1
  selector:
    matchLabels:
      app: sre-case-app
  template:
    metadata:
      labels:
        app: sre-case-app
    spec:
      containers:
        - name: app
          image: selcuksan/sre-case-app:0.5.0
          # Image kind load ile node'lara yuklendi, Docker Hub'a gitmesine gerek yok.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            # Case'in istedigi service.name bu.
            - name: OTEL_SERVICE_NAME
              value: sre-case-app
            # Uygulama tek adres biliyor; dagitimi Collector yapiyor.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector-opentelemetry-collector.monitoring.svc:4317
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_METRICS_EXPORTER
              value: otlp
            # Case log toplanmasini istemiyor.
            - name: OTEL_LOGS_EXPORTER
              value: none
          # requests = limits: pod Guaranteed QoS olur, HPA'nin gordugu kullanim orani %100'u asamaz.
          # CPU limiti ayrica JVM'in cgroup limitini okumasini saglar (availableProcessors=1).
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Varsayilan timeout 1 saniye. Yuk altinda /health de gecikince pod unready oluyor,
          # unready podun metrigi HPA'ya gitmiyor ve olcekleme duruyor. Olculdu: varsayilan
          # ayarlarla ayni testte %11 hata ve restart, asagidaki ayarlarla %0 hata.
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
