mode: deployment
replicaCount: 1

image:
  repository: otel/opentelemetry-collector-contrib

presets:
  # k8s.pod.name, k8s.namespace.name, k8s.node.name gibi oznitelikleri Collector ekler.
  # Gereken RBAC'i chart kendisi olusturur.
  kubernetesAttributes:
    enabled: true

# Prometheus'un scrape edecegi port.
ports:
  prometheus:
    enabled: true
    containerPort: 8889
    servicePort: 8889
    protocol: TCP

serviceMonitor:
  enabled: true
  metricsEndpoints:
    - port: prometheus
  # Prometheus Operator varsayilan olarak sadece kendi release etiketini tasiyan
  # ServiceMonitor'leri topluyor. Bu satir olmazsa scrape hic baslamaz.
  extraLabels:
    release: kube-prometheus-stack

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

  exporters:
    otlp_grpc/tempo:
      endpoint: tempo.monitoring.svc:4317
      tls:
        insecure: true
    prometheus:
      endpoint: 0.0.0.0:8889
      # k8s.pod.name gibi resource oznitelikleri metrik etiketi olsun.
      # Varsayilanda ayri bir target_info metrigine gidiyor ve grafikte pod kirilimi yapilamiyor.
      resource_to_telemetry_conversion:
        enabled: true

  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [k8s_attributes, batch]
        exporters: [otlp_grpc/tempo]
      metrics:
        receivers: [otlp]
        processors: [k8s_attributes, batch]
        exporters: [prometheus]
      logs: null
